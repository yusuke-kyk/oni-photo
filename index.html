<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>百鬼夜行｜妖怪フォト</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #101018; color: #fff; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .header { flex: none; text-align: center; padding: 9px 12px 7px; background: #171725; z-index: 2; }
    .header h1 { font-size: 17px; letter-spacing: .08em; margin: 0; }
    .header p { font-size: 11px; margin: 3px 0 0; color: #bfc0ce; }
    .camera-area { min-height: 0; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #07070c; }
    .stage { position: relative; flex: none; overflow: hidden; background: #080810; isolation: isolate; }
    #camera { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: block; transform-origin: center center; z-index: 0; }
    #frameImage { width: 100%; height: 100%; object-fit: fill; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .stage-message { position: absolute; left: 10px; right: 10px; bottom: 15px; z-index: 3; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.72); font-size: 13px; text-align: center; line-height: 1.6; }
    .stage-message[hidden], .review[hidden], .save-help[hidden] { display: none !important; }
    .review { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; background: #0a0a11; }
    .review img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .controls { flex: none; background: #171725; padding: 7px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
    .picker { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; margin-bottom: 7px; }
    .picker-info { text-align: center; }
    .picker-info strong { font-size: 15px; }
    .picker-info small { font-size: 11px; color: #bfc0ce; display: block; }
    .round { border: 1px solid #545469; background: #2b2b3a; border-radius: 12px; color: white; min-height: 39px; font-weight: 700; }
    .actions { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .secondary { border: 1px solid #57576f; background: #29293a; color: #fff; padding: 9px 12px; border-radius: 10px; min-height: 40px; font-size: 13px; }
    .shutter { flex: none; border: 4px solid #fff; outline: 2px solid #777; outline-offset: -9px; background: #fdfdfd; border-radius: 50%; width: 61px; height: 61px; padding: 0; }
    .shutter:active { transform: scale(.95); }
    .zoom-line { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
    .zoom-line label { font-size: 12px; white-space: nowrap; }
    .zoom-line input { width: min(220px, 60vw); accent-color: #c9b7fa; }
    .zoom-line output { font-size: 12px; min-width: 34px; }
    .review-actions { display: none; align-items: center; justify-content: center; gap: 12px; padding: 10px 0; }
    .primary { background: #e8d6a0; color: #1f1b11; border: 0; padding: 11px 18px; border-radius: 10px; font-size: 15px; font-weight: 750; }
    .save-help { font-size: 12px; line-height: 1.55; text-align: center; color: #eedfab; padding: 5px; }
    .app.is-review .live-controls { display: none; }
    .app.is-review .review-actions { display: flex; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d8baff; outline-offset: 2px; }
    @media (max-height: 620px) {
      .header { padding: 5px 8px; }
      .header h1 { font-size: 14px; }
      .header p { display: none; }
      .controls { padding-top: 4px; }
      .picker { margin-bottom: 4px; }
      .shutter { width: 49px; height: 49px; }
      .zoom-line { margin-top: 3px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <h1>百鬼夜行　妖怪フォト</h1>
    <p>好きなフレームを選んで、妖怪と一緒に撮影しよう！</p>
  </header>
  <main class="camera-area" id="cameraArea">
    <div class="stage" id="stage">
      <video id="camera" autoplay muted playsinline webkit-playsinline></video>
      <img id="frameImage" alt="妖怪フォトフレーム">
      <div class="stage-message" id="message">カメラを準備しています…</div>
      <div class="review" id="review" hidden>
        <img id="photoPreview" alt="撮影した写真">
      </div>
    </div>
  </main>
  <footer class="controls">
    <div class="live-controls">
      <div class="picker">
        <button class="round" id="prev" aria-label="前のフレーム">◀ 前へ</button>
        <div class="picker-info">
          <strong id="frameCount">01 / 16</strong>
          <small>フレームを切り替える</small>
        </div>
        <button class="round" id="next" aria-label="次のフレーム">次へ ▶</button>
      </div>
      <div class="actions">
        <button class="secondary" id="switchCamera">🔄 カメラ切替</button>
        <button class="shutter" id="shutter" aria-label="写真を撮る"></button>
        <button class="secondary" id="restart">📷 再起動</button>
      </div>
      <div class="zoom-line">
        <label for="zoom">ズーム</label>
        <input id="zoom" type="range" min="1" max="3" value="1" step="0.1">
        <output id="zoomValue" for="zoom">1.0×</output>
      </div>
    </div>
    <div class="review-actions">
      <button class="secondary" id="retake">↩ 撮り直す</button>
      <button class="primary" id="save">📲 共有・保存</button>
    </div>
    <div class="save-help" id="saveHelp" hidden></div>
  </footer>
</div>
<script>
(() => {
  'use strict';

  // GitHub の index.html と同じ場所に、この16枚を置いてください。
  const frames = Array.from({length: 16}, (_, i) =>
    `photo_frame${String(i + 1).padStart(2, '0')}.png`
  );
  const OUT_W = 1080;
  const OUT_H = 1920;

  const el = (id) => document.getElementById(id);
  const app = el('app'), area = el('cameraArea'), stage = el('stage');
  const video = el('camera'), frameImage = el('frameImage');
  const message = el('message'), frameCount = el('frameCount');
  const zoomInput = el('zoom'), zoomValue = el('zoomValue');
  const review = el('review'), photoPreview = el('photoPreview');
  const saveHelp = el('saveHelp');

  let frameIndex = 0;
  let isFrontCamera = false; // 最初は背面カメラ
  let zoom = 1;
  let stream = null;
  let startId = 0;
  let latestBlob = null;
  let latestURL = null;
  let ready = false;

  function resizeStage() {
    const w = Math.max(1, Math.min(area.clientWidth, area.clientHeight * (9 / 16)));
    stage.style.width = `${w}px`;
    stage.style.height = `${w * 16 / 9}px`;
  }

  function showMessage(text) { message.textContent = text; message.hidden = false; }
  function hideMessage() { message.hidden = true; }

  function setFrame() {
    const name = frames[frameIndex];
    frameCount.textContent = `${String(frameIndex + 1).padStart(2, '0')} / ${frames.length}`;
    frameImage.src = `./${name}`;
  }
  frameImage.addEventListener('error', () => {
    showMessage(`画像が見つかりません：${frames[frameIndex]}。GitHubのファイル名を確認してください。`);
  });
  frameImage.addEventListener('load', () => { if (ready) hideMessage(); });

  function applyZoom() {
    zoom = Number(zoomInput.value);
    zoomValue.textContent = `${zoom.toFixed(1)}×`;
    video.style.transform = `${isFrontCamera ? 'scaleX(-1) ' : ''}scale(${zoom})`;
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
    video.srcObject = null;
    ready = false;
  }

  async function startCamera() {
    const id = ++startId;
    stopStream();
    showMessage('カメラを準備しています…　最初はアクセスを許可してください。');
    if (!navigator.mediaDevices?.getUserMedia) {
      showMessage('カメラを利用できません。HTTPSで公開したページをSafariまたはChromeで開いてください。');
      return;
    }
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: isFrontCamera ? 'user' : 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      if (id !== startId) { acquired.getTracks().forEach(t => t.stop()); return; }
      stream = acquired;
      video.srcObject = stream;
      await video.play();
      if (id !== startId) return;
      ready = true;
      applyZoom();
      if (frameImage.complete && frameImage.naturalWidth > 0) hideMessage();
      else showMessage('フレーム画像を読み込んでいます…');
    } catch (err) {
      if (id !== startId) return;
      console.error('Camera error:', err);
      let hint = 'カメラが起動できません。端末のカメラ許可を確認して「再起動」を押してください。';
      if (err?.name === 'NotAllowedError' || err?.name === 'PermissionDeniedError') {
        hint = 'カメラの使用が許可されていません。ブラウザのサイト設定でカメラを許可し、「再起動」を押してください。';
      } else if (err?.name === 'NotFoundError') {
        hint = '利用できるカメラが見つかりませんでした。';
      } else if (err?.name === 'NotReadableError') {
        hint = '別のアプリがカメラを使用中かもしれません。カメラアプリを閉じて「再起動」を押してください。';
      }
      showMessage(hint);
    }
  }

  function drawCameraCover(ctx, width, height) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) throw new Error('カメラ映像が準備中です。');
    const outRatio = width / height;
    let cropW, cropH;
    if (vw / vh > outRatio) { cropH = vh; cropW = vh * outRatio; }
    else { cropW = vw; cropH = vw / outRatio; }
    cropW /= zoom;
    cropH /= zoom;
    const sx = (vw - cropW) / 2, sy = (vh - cropH) / 2;
    ctx.save();
    if (isFrontCamera) { ctx.translate(width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, width, height);
    ctx.restore();
  }

  function revokePrevious() {
    if (latestURL) { URL.revokeObjectURL(latestURL); latestURL = null; }
    latestBlob = null;
  }

  async function takePhoto() {
    if (!ready || !frameImage.complete || !frameImage.naturalWidth) {
      showMessage('カメラまたはフレームの準備ができていません。');
      return;
    }
    el('shutter').disabled = true;
    try {
      const canvas = document.createElement('canvas');
      canvas.width = OUT_W;
      canvas.height = OUT_H;
      const ctx = canvas.getContext('2d');
      drawCameraCover(ctx, OUT_W, OUT_H);
      ctx.drawImage(frameImage, 0, 0, OUT_W, OUT_H);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('画像の生成に失敗しました。');
      revokePrevious();
      latestBlob = blob;
      latestURL = URL.createObjectURL(blob);
      photoPreview.src = latestURL;
      review.hidden = false;
      app.classList.add('is-review');
      saveHelp.hidden = true;
      resizeStage();
    } catch (err) {
      console.error(err);
      showMessage(`撮影に失敗しました：${err.message || '再試行してください'}`);
    } finally {
      el('shutter').disabled = false;
    }
  }

  async function savePhoto() {
    if (!latestBlob) return;
    const name = `hyakki-yako-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
    const file = new File([latestBlob], name, {type: 'image/png'});
    saveHelp.hidden = true;
    if (navigator.share && (!navigator.canShare || navigator.canShare({files: [file]}))) {
      try {
        await navigator.share({files: [file], title: '百鬼夜行 妖怪フォト'});
        return;
      } catch (err) {
        if (err?.name === 'AbortError') return; // ユーザーが共有を閉じた場合
        console.warn('Share failed:', err);
      }
    }
    // Web Share API を使えない場合の保存方法。
    const a = document.createElement('a');
    a.href = latestURL;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    saveHelp.textContent = '保存されない場合は、写真を長押しして「画像を保存」を選んでください。';
    saveHelp.hidden = false;
  }

  el('prev').addEventListener('click', () => { frameIndex = (frameIndex - 1 + frames.length) % frames.length; setFrame(); });
  el('next').addEventListener('click', () => { frameIndex = (frameIndex + 1) % frames.length; setFrame(); });
  el('switchCamera').addEventListener('click', () => { isFrontCamera = !isFrontCamera; startCamera(); });
  el('restart').addEventListener('click', startCamera);
  zoomInput.addEventListener('input', applyZoom);
  el('shutter').addEventListener('click', takePhoto);
  el('retake').addEventListener('click', () => {
    review.hidden = true;
    app.classList.remove('is-review');
    saveHelp.hidden = true;
    photoPreview.removeAttribute('src');
    revokePrevious();
    resizeStage();
  });
  el('save').addEventListener('click', savePhoto);
  window.addEventListener('resize', resizeStage);
  if (window.ResizeObserver) new ResizeObserver(resizeStage).observe(area);
  window.addEventListener('pagehide', stopStream);

  resizeStage();
  setFrame();
  applyZoom();
  startCamera();
})();
</script>
</body>
</html>
